name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python scripts/verify_native.py
      - run: python -m unittest discover -s tests -p test_config.py -v
      - run: python -m unittest discover -s tests -p test_csv_watcher.py -v
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syncbridge
          POSTGRES_PASSWORD: syncbridge
          POSTGRES_DB: syncbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncbridge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://syncbridge:syncbridge@localhost:5432/syncbridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[postgres]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q syncbridge
      - name: Validate WordPress connector syntax
        run: php -l integrations/wordpress/syncbridge-crm/syncbridge-crm.php
      - name: Test WordPress connector boundaries
        run: php tests/test_wordpress_connector.php
      - name: Add harmless build-context secret exclusion fixture
        run: python -c "from pathlib import Path; Path('.env').write_text('SYNCBRIDGE_BUILD_SENTINEL=not-a-secret\n')"
      - run: docker build -t syncbridge:${{ github.sha }} .
      - name: Verify built container with PostgreSQL and REST delivery
        timeout-minutes: 3
        run: python scripts/verify_container.py syncbridge:${{ github.sha }}
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config
