name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syncbridge
          POSTGRES_PASSWORD: syncbridge
          POSTGRES_DB: syncbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncbridge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://syncbridge:syncbridge@localhost:5432/syncbridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[postgres]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q syncbridge
      - name: Validate WordPress connector syntax
        run: php -l integrations/wordpress/syncbridge-crm/syncbridge-crm.php
      - run: docker build -t syncbridge:${{ github.sha }} .
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config
