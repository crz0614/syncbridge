<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SyncBridge Console</title><style>
:root{color-scheme:dark;--bg:#07110f;--card:#10201b;--line:#25463a;--text:#effaf5;--muted:#9bb4aa;--mint:#6de8b3;--red:#ff8f8f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#173d31,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.shell{width:min(1120px,calc(100% - 28px));margin:auto;padding:36px 0 70px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:36px}h1{font-size:clamp(32px,6vw,62px);letter-spacing:-.05em;margin:4px 0}.eyebrow{color:var(--mint);font-size:12px;font-weight:800;letter-spacing:.16em}.muted{color:var(--muted)}.connect,.card{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:18px}.connect{display:flex;gap:9px;flex-wrap:wrap}input,button{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#081611;color:var(--text);font:inherit}button{cursor:pointer;font-weight:800}button.primary{background:var(--mint);color:#052018;border-color:var(--mint)}button.retry{padding:6px 9px;font-size:12px}.health,.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat strong{display:block;font-size:27px;color:var(--mint)}.table{overflow:auto;border:1px solid var(--line);border-radius:16px}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:13px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}.status{font-weight:800}.dead{color:var(--red)}.done{color:var(--mint)}#message{min-height:24px;color:var(--muted)}@media(max-width:760px){header{align-items:flex-start;flex-direction:column}.health,.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="shell"><header><div><div class="eyebrow">OPERATIONS CONSOLE</div><h1>SyncBridge</h1><div class="muted">Inspect delivery health, review events and retry failures.</div></div><div class="connect"><input id="token" type="password" autocomplete="current-password" placeholder="Operator API token"><button class="primary" id="connect">Connect</button></div></header><div id="message">Enter the operator token to load private event data.</div><section class="health" id="health"></section><section class="stats" id="stats"></section><section class="table"><table><thead><tr><th>ID</th><th>Source</th><th>Key</th><th>Status</th><th>Attempts</th><th>Updated</th><th>Error</th><th>Action</th></tr></thead><tbody id="events"><tr><td colspan="8" class="muted">Not connected</td></tr></tbody></table></section></main><script>
const $=id=>document.getElementById(id), token=$('token'); token.value=sessionStorage.getItem('syncbridge-token')||'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,options={}){const value=token.value.trim();const response=await fetch(path,{...options,headers:{Authorization:`Bearer ${value}`,...options.headers}});const data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}
function boxes(target,data){$(target).innerHTML=Object.entries(data).map(([k,v])=>`<div class="card stat"><span class="muted">${esc(k.replaceAll('_',' '))}</span><strong>${esc(v)}</strong></div>`).join('')}
async function load(){try{sessionStorage.setItem('syncbridge-token',token.value.trim());$('message').textContent='Loading…';const [health,data]=await Promise.all([fetch('/health').then(r=>r.json()),request('/api/events')]);boxes('health',health);boxes('stats',{pending:data.stats.pending||0,processing:data.stats.processing||0,retry:data.stats.retry||0,dead:data.stats.dead||0,done:data.stats.done||0});$('events').innerHTML=data.events.length?data.events.map(e=>`<tr><td>${e.id}</td><td>${esc(e.source)}</td><td>${esc(e.idempotency_key)}</td><td class="status ${esc(e.status)}">${esc(e.status)}</td><td>${e.attempts}</td><td>${new Date(e.updated_at*1000).toLocaleString()}</td><td title="${esc(e.last_error)}">${esc((e.last_error||'').slice(0,80))}</td><td>${['dead','retry'].includes(e.status)?`<button class="retry" data-id="${e.id}">Retry</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="8" class="muted">No events yet</td></tr>';$('message').textContent=`Connected · ${data.events.length} recent events`;document.querySelectorAll('.retry').forEach(b=>b.onclick=()=>retry(b.dataset.id))}catch(error){$('message').textContent=`Connection failed: ${error.message}`}}
async function retry(id){try{await request(`/api/events/${id}/retry`,{method:'POST'});await load()}catch(error){$('message').textContent=`Retry failed: ${error.message}`}}
$('connect').onclick=load;token.onkeydown=e=>{if(e.key==='Enter')load()};if(token.value)load();setInterval(()=>{if(token.value)load()},10000);
</script></body></html>
